# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: autoload_file_location
    status: active
    api: "src/core/[snake_case_name].gd — 스크립트 전용, 씬 파일 없음 (* 접두사)"
    not: "씬 파일(.tscn) 기반 Autoload 등록"
    adr: docs/architecture/adr-0002-foundation-autoload-registration-order.md
    reason: "스크립트 전용 Autoload는 씬 인스턴스화 오버헤드 없이 초기화됨. src/core/ 집중으로 위치 규칙 단순화."
    referenced_by:
      - docs/architecture/adr-0002-foundation-autoload-registration-order.md
    added: "2026-04-27"
    revised: ""

# Example:
#
# api_decisions:

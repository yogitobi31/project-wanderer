# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: unauthorized_autoload_usage
    status: active
    description: "Autoload 싱글톤은 4가지 기준(순수 데이터 레지스트리, 팬아웃 3+, 좁은 API, 단순 초기화)을
      모두 충족한 시스템에만 허용된다. 기준을 충족하지 않는 시스템은 의존성 주입 또는 EventBus를 사용한다."
    why: "기준 없는 Autoload 확산은 전역 상태를 증가시키고 시스템 간 숨겨진 의존성을 만들어
      테스트와 리팩터링을 어렵게 한다."
    adr: docs/architecture/adr-0001-data-registry-autoload.md
    added: "2026-04-19"

  - pattern: autoload_as_event_bus
    status: active
    description: "Autoload를 시스템 간 이벤트/신호 중계 버스로 사용해서는 안 된다.
      이벤트 전달은 전용 EventBus 또는 직접 신호 연결을 사용한다."
    why: "Autoload가 신호 허브가 되면 모든 시스템이 Autoload에 의존하게 되어
      의존성 그래프가 별 모양으로 수렴하고 순환 의존 위험이 증가한다."
    adr: docs/architecture/adr-0001-data-registry-autoload.md
    added: "2026-04-19"

  - pattern: shallow_copy_autoload_resource
    status: active
    description: "Autoload Dictionary에 저장된 Resource를 복사할 때 `duplicate()`(얕은 복사)를
      사용해서는 안 된다. 반드시 `duplicate_deep()`(Godot 4.5+)을 사용한다."
    why: "얕은 복사는 내부 Reference 타입 필드를 공유하므로 복사본 수정이 레지스트리 원본을
      오염시킨다. NPCRecord의 quest_flags Dictionary 등이 해당된다."
    adr: docs/architecture/adr-0001-data-registry-autoload.md
    added: "2026-04-19"

  - pattern: unauthorized_service_autoload
    status: active
    description: "서비스 Autoload는 S-1~S-4 기준(전역 생명주기 필요, 씬 계층 주입 불가,
      단일 서비스 책임, 순환 의존 없음)을 모두 충족해야 한다. 기준 미충족 시 씬 내 Node로 구현한다."
    why: "기준 없는 서비스 Autoload 확산은 전역 상태를 증가시키고 테스트를 어렵게 한다.
      ADR-0002가 허용된 9개 Autoload를 확정했으며 추가는 이 기준을 통과해야 한다."
    adr: docs/architecture/adr-0002-foundation-autoload-registration-order.md
    added: "2026-04-27"

  - pattern: tilemap_node_usage
    status: active
    description: "TileMap 노드를 사용해서는 안 된다. 반드시 TileMapLayer를 사용한다."
    why: "TileMap은 Godot 4.3에서 TileMapLayer로 대체되어 deprecated 상태다.
      미래 버전에서 제거될 수 있으므로 프로젝트 시작 시점부터 TileMapLayer를 강제한다."
    adr: docs/architecture/adr-0003-scene-map-ui-overlay-contract.md
    added: "2026-04-27"


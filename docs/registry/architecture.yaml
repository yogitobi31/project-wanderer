# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: item_definition_read
    status: active
    pattern: direct_call
    producer: ItemDB
    consumers:
      - 인벤토리-시스템
      - 수집-자원-시스템
      - 퀘스트-상태-머신
    adr: docs/architecture/adr-0001-data-registry-autoload.md
    signal_signature: "ItemDB.get(item_id: StringName) -> ItemDefinition"
    referenced_by:
      - docs/architecture/adr-0001-data-registry-autoload.md
    added: "2026-04-19"
    revised: ""

  - contract: npc_state_read
    status: active
    pattern: direct_call
    producer: NPCRegistry
    consumers:
      - 대화-시스템
      - 퀘스트-상태-머신
      - 동료-AI-시스템
      - 동료-합류-이벤트
      - 월드-조건-시스템
    adr: docs/architecture/adr-0001-data-registry-autoload.md
    signal_signature: "NPCRegistry.get_npc(npc_id: StringName) -> NPCRecord"
    referenced_by:
      - docs/architecture/adr-0001-data-registry-autoload.md
    added: "2026-04-19"
    revised: ""

  - contract: npc_state_write
    status: active
    pattern: direct_call
    producer: NPCRegistry
    consumers:
      - NPCRegistry-owner-only
    adr: docs/architecture/adr-0001-data-registry-autoload.md
    signal_signature: "NPCRegistry.set_state(npc_id: StringName, state: RelationshipState) -> void"
    referenced_by:
      - docs/architecture/adr-0001-data-registry-autoload.md
    added: "2026-04-19"
    revised: ""

  - contract: npc_state_notification
    status: active
    pattern: signal
    producer: NPCRegistry
    consumers:
      - 대화-시스템
      - 퀘스트-상태-머신
      - 동료-AI-시스템
      - 세이브-로드-시스템
    adr: docs/architecture/adr-0001-data-registry-autoload.md
    signal_signature: "npc_state_changed(npc_id: StringName, new_state: int)"
    referenced_by:
      - docs/architecture/adr-0001-data-registry-autoload.md
    added: "2026-04-19"
    revised: ""

  - contract: registry_ready_notification
    status: active
    pattern: signal
    producer: NPCRegistry
    consumers:
      - QuestManager
      - 동료-합류-이벤트
    adr: docs/architecture/adr-0002-foundation-autoload-registration-order.md
    signal_signature: "registry_initialized()"
    referenced_by:
      - docs/architecture/adr-0002-foundation-autoload-registration-order.md
    added: "2026-04-27"
    revised: ""

